services:
  app:
    image: ghcr.io/elephant-on-github/simple-ytdl-ui:latest
    container_name: simple-ytdl-ui
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      # State: library index, job list, Google token
      - ./data:/data
      # Media files
      - ./library:/library
      # Optional: YouTube session (read-only is fine)
      # - ./cookies.txt:/config/cookies.txt:ro
    environment:
      PORT: "8080"
      DATA_DIR: /data
      LIBRARY_DIR: /library
      YTDLP_BIN: /usr/local/bin/yt-dlp
      FFMPEG_BIN: /usr/bin/ffmpeg
      CONCURRENT_DOWNLOADS: "2"
      DEFAULT_MODE: video
      TZ: UTC
      # --- Optional: YouTube session ---
      # YTDLP_COOKIES: /config/cookies.txt
      # --- Optional: Password lock ---
      # AUTH_PASSWORD: your-secret-password
      # --- Optional: Google OAuth ---
      # GOOGLE_CLIENT_ID: your-client-id
      # GOOGLE_CLIENT_SECRET: your-client-secret